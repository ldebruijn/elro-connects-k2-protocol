name: Publish

# Releases are cut by pushing a version tag (e.g. v0.1.0). The tag is the only
# trigger: nothing publishes on a plain push to main, so an accidental merge
# can never reach PyPI.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine

      # The tag and pyproject's version must agree, or PyPI ends up with a
      # release whose git tag points at different code than the sdist. Checked
      # before the build so the failure is unambiguous.
      - name: Verify tag matches the declared version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag does not match pyproject version $declared"
            exit 1
          fi
          echo "version OK: $declared"

      - name: Build sdist + wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Named environment so PyPI's trusted publisher can be scoped to it, and so
    # a required reviewer can be added later without touching this file.
    environment:
      name: pypi
      url: https://pypi.org/p/elro-connects-k2-protocol
    permissions:
      # Mints the short-lived OIDC token that PyPI exchanges for upload rights.
      # This is what replaces a stored API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
